<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redefinir Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===========================
           RESET E VARIÁVEIS
           =========================== */
        :root {
            --primary: #C68AFF;
            --primary-dark: #9b5fe0;
            --primary-light: #e8d5ff;
            --secondary: #00eaff;
            --secondary-dark: #00b8cc;
            --accent: #ff5050;
            --background: #0a0a0a;
            --surface: #1a1a1a;
            --surface-light: #2a2a2a;
            --surface-hover: #333333;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #666666;
            --border: #333333;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 60px rgba(198, 138, 255, 0.15);
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
            --gradient-dark: linear-gradient(135deg, var(--primary-dark), #0099cc);
            --gradient-bg: linear-gradient(135deg, #1a1a1a 0%, #2a1a35 50%, #1a2a35 100%);
            --success: #00e676;
            --error: #ff5252;
            --warning: #ffa726;
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(198, 138, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 234, 255, 0.05) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .reset-container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow), var(--shadow-glow);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            background: rgba(26, 26, 26, 0.95);
        }

        .reset-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: calc(var(--radius) + 2px);
            background: var(--gradient);
            z-index: -1;
            opacity: 0.3;
            filter: blur(10px);
            animation: pulseBorder 3s ease-in-out infinite;
        }

        @keyframes pulseBorder {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(60px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .reset-logo {
            display: inline-block;
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            text-decoration: none;
            letter-spacing: -1px;
            position: relative;
        }

        .reset-logo i {
            -webkit-text-fill-color: var(--primary);
            margin-right: 4px;
        }

        .reset-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .reset-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
        }

        .reset-icon-wrapper {
            position: relative;
            display: inline-block;
            margin: 0 auto 1.5rem;
        }

        .reset-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(198, 138, 255, 0.15), rgba(0, 234, 255, 0.05));
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--primary);
            transition: var(--transition);
            position: relative;
        }

        .reset-icon .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary);
            animation: pulseRing 2s ease-out infinite;
            opacity: 0;
        }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .reset-icon.success {
            border-color: var(--success);
            color: var(--success);
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.15), rgba(0, 234, 255, 0.05));
        }

        .reset-icon.success .pulse-ring {
            border-color: var(--success);
        }

        .reset-icon.error {
            border-color: var(--error);
            color: var(--error);
            background: linear-gradient(135deg, rgba(255, 82, 82, 0.15), rgba(255, 82, 82, 0.05));
        }

        .reset-icon.error .pulse-ring {
            border-color: var(--error);
        }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--surface-light);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            overflow: hidden;
        }

        .form-group .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(198, 138, 255, 0.1);
            transform: translateY(-1px);
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 0 0 1rem;
            color: var(--text-muted);
            font-size: 1rem;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .form-group .input-wrapper:focus-within .input-icon {
            color: var(--primary);
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            font-size: 16px !important;
            transition: var(--transition);
        }

        .form-group .input-wrapper input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        .form-group .input-wrapper .toggle-password {
            padding: 0 1rem 0 0.5rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            flex-shrink: 0;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: var(--text-secondary);
        }

        .password-strength {
            margin-top: 0.3rem;
            display: flex;
            gap: 0.3rem;
            align-items: center;
        }

        .password-strength .bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            transition: var(--transition);
        }

        .password-strength .bar.active.weak {
            background: var(--error);
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.3);
        }

        .password-strength .bar.active.medium {
            background: var(--warning);
            box-shadow: 0 0 10px rgba(255, 167, 38, 0.3);
        }

        .password-strength .bar.active.strong {
            background: var(--success);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        .password-strength .label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 45px;
            text-align: right;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .password-hint {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .password-hint i {
            font-size: 0.7rem;
        }

        .reset-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
            min-height: 50px;
            background: var(--gradient);
            color: var(--background);
            box-shadow: 0 4px 20px rgba(198, 138, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .reset-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .reset-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .reset-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(198, 138, 255, 0.5);
        }

        .reset-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .reset-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .reset-btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid var(--background);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .reset-btn.loading .spinner {
            display: inline-block;
        }

        .reset-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .reset-message {
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            animation: fadeIn 0.4s ease;
            font-weight: 500;
        }

        .reset-message.show {
            display: flex;
        }

        .reset-message.success {
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.2);
            color: var(--success);
        }

        .reset-message.error {
            background: rgba(255, 82, 82, 0.08);
            border: 1px solid rgba(255, 82, 82, 0.2);
            color: var(--error);
        }

        .reset-message.info {
            background: rgba(0, 234, 255, 0.06);
            border: 1px solid rgba(0, 234, 255, 0.15);
            color: var(--secondary);
        }

        .reset-message i {
            font-size: 1.1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .token-status {
            text-align: center;
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            display: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .token-status.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .token-status.error {
            background: rgba(255, 82, 82, 0.08);
            border: 1px solid rgba(255, 82, 82, 0.2);
            color: var(--error);
        }

        .token-status.success {
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.2);
            color: var(--success);
        }

        .token-status.info {
            background: rgba(0, 234, 255, 0.06);
            border: 1px solid rgba(0, 234, 255, 0.15);
            color: var(--secondary);
        }

        .token-status i {
            margin-right: 0.5rem;
        }

        .reset-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .reset-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 500;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
        }

        .reset-links a:hover {
            color: var(--primary);
            background: rgba(198, 138, 255, 0.05);
        }

        .reset-links .back-to-login {
            color: var(--primary);
            font-weight: 600;
        }

        .reset-links .back-to-login:hover {
            color: var(--primary-dark);
            background: rgba(198, 138, 255, 0.1);
        }

        .reset-links .divider-dot {
            color: var(--border);
            font-size: 0.3rem;
        }

        .reset-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .reset-footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 300;
        }

        .reset-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .reset-footer a:hover {
            color: var(--primary-dark);
        }

        @media (max-width: 480px) {
            body { padding: 0.8rem; }
            .reset-container { padding: 1.8rem 1.2rem; border-radius: 16px; }
            .reset-header h1 { font-size: 1.5rem; }
            .reset-header p { font-size: 0.85rem; }
            .reset-icon { width: 70px; height: 70px; font-size: 2rem; }
            .reset-links { flex-direction: column; gap: 0.5rem; }
            .reset-links .divider-dot { display: none; }
        }

        @media (max-width: 360px) {
            .reset-container { padding: 1.2rem 0.8rem; }
            .reset-header h1 { font-size: 1.3rem; }
            .reset-icon { width: 60px; height: 60px; font-size: 1.6rem; }
            .reset-btn { font-size: 0.9rem; padding: 0.8rem; }
        }

        html[data-theme="light"] {
            --primary: #7C3AED;
            --primary-dark: #6D28D9;
            --secondary: #0891B2;
            --background: #F8FAFC;
            --surface: #FFFFFF;
            --surface-light: #F1F5F9;
            --surface-hover: #E2E8F0;
            --text: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-glow: 0 0 60px rgba(124, 58, 237, 0.05);
            --gradient-bg: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
        }

        html[data-theme="light"] .reset-container { background: rgba(255, 255, 255, 0.95); }
        html[data-theme="light"] .reset-container::before { opacity: 0.15; }
        html[data-theme="light"] .form-group .input-wrapper { background: white; border-color: #E2E8F0; }
        html[data-theme="light"] .form-group .input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.08); }
        html[data-theme="light"] body::before { background: radial-gradient(circle at 20% 50%, rgba(124, 58, 237, 0.03) 0%, transparent 50%), radial-gradient(circle at 80% 50%, rgba(8, 145, 178, 0.03) 0%, transparent 50%); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        .shake { animation: shake 0.5s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .fade-in-up { animation: fadeInUp 0.6s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="reset-container" role="main" aria-labelledby="reset-title">
        <div class="reset-header">
            <a href="#" class="reset-logo"><i class="fas fa-cube"></i> Logo</a>
            <div class="reset-icon-wrapper">
                <div class="reset-icon" id="resetIcon">
                    <span class="pulse-ring"></span>
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            <h1 id="reset-title">Redefinir Senha</h1>
            <p id="reset-subtitle">Crie uma nova senha para sua conta</p>
        </div>

        <div id="tokenStatus" class="token-status">
            <i class="fas fa-spinner fa-spin"></i>
            <span id="tokenStatusText">Verificando token...</span>
        </div>

        <div id="resetMessage" class="reset-message" role="alert" aria-live="polite">
            <i class="fas fa-check-circle"></i>
            <span id="messageText">Mensagem</span>
        </div>

        <form id="resetForm" class="reset-form" novalidate>
            <div class="form-group">
                <label for="newPassword"><i class="fas fa-lock" style="margin-right: 6px;"></i> Nova senha</label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true"><i class="fas fa-key"></i></span>
                    <input type="password" id="newPassword" name="password" placeholder="Digite sua nova senha" required autocomplete="new-password" minlength="6" />
                    <button type="button" class="toggle-password" aria-label="Mostrar senha" tabindex="-1"><i class="fas fa-eye"></i></button>
                </div>
                <div class="password-strength">
                    <div class="bar" data-index="0"></div>
                    <div class="bar" data-index="1"></div>
                    <div class="bar" data-index="2"></div>
                    <span class="label" id="strengthLabel">—</span>
                </div>
                <div class="password-hint">
                    <i class="fas fa-info-circle"></i>
                    <span>Mínimo 6 caracteres com letras, números e símbolos</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><i class="fas fa-check-circle" style="margin-right: 6px;"></i> Confirmar senha</label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true"><i class="fas fa-check-double"></i></span>
                    <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirme sua nova senha" required autocomplete="new-password" />
                </div>
            </div>

            <button type="submit" id="resetBtn" class="reset-btn" disabled>
                <span class="spinner" aria-hidden="true"></span>
                <span class="btn-text" id="btnText">
                    <i class="fas fa-sync-alt" style="margin-right: 8px;"></i> Redefinir senha
                </span>
            </button>

            <div class="reset-links">
                <a href="https://first-project-smoky-two.vercel.app/" class="back-to-login"><i class="fas fa-arrow-left"></i> Voltar à loja</a>
                <span class="divider-dot">•</span>
                <a href="#" id="resendLink" style="display: none;"><i class="fas fa-redo"></i> Solicitar novo link</a>
            </div>
        </form>

        <div class="reset-footer">
            <p><i class="fas fa-shield-alt" style="color: var(--primary);"></i> Sua segurança é nossa prioridade</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ===========================
            // 1. CONFIGURAÇÃO DO CLIENTE SUPABASE - PKCE!
            // ===========================
            const SUPABASE_URL = 'https://zdrplxumrqxlqpmorxbd.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkcnBseHVtcnF4bHFwbW9yeGJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTM0ODIsImV4cCI6MjA5MTIyOTQ4Mn0.cNyw0YHWKhiMunyJKIr9mbp61E31eXCn2XWBO_V9w4o';

            // 🔴 A CHAVE ESTÁ AQUI: flowType: 'pkce'
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    flowType: 'pkce',  // 🔴 MUDEI PARA PKCE!
                    detectSessionInUrl: true
                }
            });

            // ===========================
            // DOM ELEMENTS
            // ===========================
            const form = document.getElementById('resetForm');
            const passwordInput = document.getElementById('newPassword');
            const confirmInput = document.getElementById('confirmPassword');
            const resetBtn = document.getElementById('resetBtn');
            const messageEl = document.getElementById('resetMessage');
            const messageText = document.getElementById('messageText');
            const tokenStatus = document.getElementById('tokenStatus');
            const tokenStatusText = document.getElementById('tokenStatusText');
            const resetIcon = document.getElementById('resetIcon');
            const subtitle = document.getElementById('reset-subtitle');

            let isRecoveryValid = false;

            // ===========================
            // 2. FUNÇÃO PARA EXTRAIR E TROCAR O CÓDIGO
            // ===========================
            async function handleRecovery() {
                // 🔴 PEGA O CÓDIGO DA QUERY STRING (?code=...)
                const queryParams = new URLSearchParams(window.location.search);
                const code = queryParams.get('code');
                const type = queryParams.get('type');

                console.log('🔍 Query String:', window.location.search);
                console.log('🔑 Código extraído:', code ? code.substring(0, 20) + '...' : 'NÃO ENCONTRADO');
                console.log('📌 Tipo:', type);

                // Se não tem code, tenta da hash (fallback)
                let token = code;
                if (!token) {
                    const hash = window.location.hash;
                    if (hash && hash.length > 1) {
                        const hashParams = new URLSearchParams(hash.substring(1));
                        token = hashParams.get('access_token') || hashParams.get('token');
                        console.log('🔑 Token da hash (fallback):', token ? token.substring(0, 20) + '...' : 'NÃO ENCONTRADO');
                    }
                }

                if (!token) {
                    console.error('❌ Nenhum código ou token encontrado');
                    showTokenStatus('❌ Link inválido. Certifique-se de que o link do e-mail está correto.', 'error');
                    updateIcon('error');
                    subtitle.textContent = 'Link inválido';
                    return false;
                }

                try {
                    // 🔴 MÉTODO CORRETO: exchangeCodeForSession com PKCE
                    console.log('🔄 Tentando exchangeCodeForSession (PKCE)...');
                    const { data, error } = await supabase.auth.exchangeCodeForSession(token);

                    if (error) {
                        console.error('❌ exchangeCodeForSession falhou:', error);
                        throw error;
                    }

                    if (data?.user) {
                        console.log('✅ Sessão criada com sucesso!', data.user.email);
                        isRecoveryValid = true;
                        resetBtn.disabled = false;
                        resetBtn.classList.remove('disabled');
                        showTokenStatus('✅ Link validado! Digite sua nova senha.', 'success');
                        updateIcon('success');
                        subtitle.textContent = `Redefinindo senha para ${data.user.email}`;
                        return true;
                    }

                    console.error('❌ Nenhum usuário retornado');
                    showTokenStatus('❌ Token inválido ou expirado. Solicite um novo link.', 'error');
                    updateIcon('error');
                    subtitle.textContent = 'Token inválido ou expirado';
                    return false;

                } catch (error) {
                    console.error('❌ Erro ao trocar código:', error);
                    showTokenStatus('❌ Token inválido ou expirado. Solicite um novo link.', 'error');
                    updateIcon('error');
                    subtitle.textContent = 'Token inválido ou expirado';
                    return false;
                }
            }

            // ===========================
            // 3. TOGGLE PASSWORD - COMPLETO
            // ===========================
            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const input = this.closest('.input-wrapper').querySelector('input');
                    if (!input) return;
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    const icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    }
                });
            });

            // ===========================
            // 4. FUNÇÕES AUXILIARES
            // ===========================
            function showMessage(text, type = 'info') {
                messageEl.className = 'reset-message show ' + type;
                messageText.textContent = text;
                clearTimeout(messageEl._timeout);
                messageEl._timeout = setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 6000);
            }

            function showTokenStatus(text, type = 'info') {
                tokenStatus.className = 'token-status show ' + type;
                tokenStatusText.innerHTML = text;
            }

            function updateIcon(type) {
                resetIcon.className = 'reset-icon ' + type;
                const icon = resetIcon.querySelector('i');
                if (type === 'success') {
                    icon.className = 'fas fa-check-circle';
                } else if (type === 'error') {
                    icon.className = 'fas fa-times-circle';
                } else {
                    icon.className = 'fas fa-lock';
                }
            }

            // ===========================
            // 5. SUBMETER A NOVA SENHA
            // ===========================
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                console.log('🔥 Formulário submetido!');

                if (!isRecoveryValid) {
                    showMessage('Sessão inválida. Por favor, acesse a página através do link enviado no e-mail.', 'error');
                    console.error('❌ isRecoveryValid é FALSE!');
                    return;
                }

                if (resetBtn.classList.contains('loading')) {
                    console.log('⏳ Botão já está em loading...');
                    return;
                }

                const password = passwordInput.value;
                const confirm = confirmInput.value;

                if (password.length < 6) {
                    showMessage('A senha deve ter no mínimo 6 caracteres.', 'error');
                    passwordInput.focus();
                    return;
                }

                if (password !== confirm) {
                    showMessage('As senhas não coincidem.', 'error');
                    confirmInput.focus();
                    return;
                }

                resetBtn.classList.add('loading');
                resetBtn.disabled = true;

                try {
                    const { data, error } = await supabase.auth.updateUser({
                        password: password
                    });

                    if (error) {
                        console.error('❌ Erro na atualização:', error);
                        throw error;
                    }

                    console.log('✅ Senha atualizada com sucesso!', data);
                    showMessage('✅ Senha redefinida com sucesso!', 'success');
                    updateIcon('success');
                    subtitle.textContent = 'Senha alterada com sucesso! 🎉';
                    passwordInput.disabled = true;
                    confirmInput.disabled = true;

                    await supabase.auth.signOut();

                    setTimeout(() => {
                        window.location.href = 'https://first-project-smoky-two.vercel.app/';
                    }, 2500);

                } catch (error) {
                    console.error('❌ Erro:', error);
                    showMessage('❌ ' + (error.message || 'Erro ao redefinir senha'), 'error');
                    resetBtn.classList.remove('loading');
                    resetBtn.disabled = false;
                }
            });

            // ===========================
            // 6. FORÇA DA SENHA
            // ===========================
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                const bars = document.querySelectorAll('.password-strength .bar');
                const label = document.getElementById('strengthLabel');

                bars.forEach(bar => bar.className = 'bar');

                if (password.length === 0) {
                    label.textContent = '—';
                    label.style.color = 'var(--text-muted)';
                    return;
                }

                const hasLower = /[a-z]/.test(password);
                const hasUpper = /[A-Z]/.test(password);
                const hasNumber = /[0-9]/.test(password);
                const hasSpecial = /[^a-zA-Z0-9]/.test(password);
                const length = password.length;

                let score = 0;
                if (length >= 6) score++;
                if (length >= 10) score++;
                if (hasLower && hasUpper) score++;
                if (hasNumber) score++;
                if (hasSpecial) score++;

                let strength = 'weak';
                let labelText = 'Fraca';

                if (score >= 4 && length >= 8) {
                    strength = 'strong';
                    labelText = 'Forte';
                } else if (score >= 2 && length >= 6) {
                    strength = 'medium';
                    labelText = 'Média';
                }

                const activeBars = strength === 'weak' ? 1 : strength === 'medium' ? 2 : 3;
                bars.forEach((bar, index) => {
                    if (index < activeBars) {
                        bar.className = 'bar active ' + strength;
                    }
                });

                label.textContent = labelText;
                label.style.color = strength === 'strong' ? 'var(--success)' :
                                   strength === 'medium' ? 'var(--warning)' : 'var(--error)';
            });

            // ===========================
            // 7. REENVIAR LINK
            // ===========================
            document.getElementById('resendLink')?.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'recuperar-senha.html';
            });

            // ===========================
            // 8. INICIALIZAÇÃO
            // ===========================
            async function init() {
                console.log('🚀 Iniciando página de redefinição de senha...');
                console.log('📍 URL atual:', window.location.href);
                console.log('📍 Query String:', window.location.search);
                console.log('📍 Hash:', window.location.hash);

                // Tenta processar o código
                await handleRecovery();

                // Fallback: tenta novamente após 2 segundos
                if (!isRecoveryValid) {
                    console.log('⏰ Tentando processar novamente após 2 segundos...');
                    setTimeout(async () => {
                        await handleRecovery();
                    }, 2000);
                }
            }

            // Detectar tema
            if (window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.documentElement.setAttribute('data-theme', 'light');
            }

            init();
        });
    </script>
</body>
</html>
